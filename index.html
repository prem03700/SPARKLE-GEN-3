<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>SPARKLE GEN-3 — Personal Workspace</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">s</div>
        <div class="brand-copy"><strong>SPARKLE</strong><span>GEN—3</span></div>
        <button class="icon-button sidebar-collapse" id="collapseSidebar" aria-label="Collapse sidebar" title="Collapse sidebar">⇤</button>
      </div>
      <button class="new-chat-button" id="newChat"><span>＋</span> New conversation</button>
      <nav class="primary-nav" id="primaryNav">
        <button class="nav-item" data-view="home"><span class="nav-icon">⌂</span><span class="nav-text">Home</span></button>
        <div class="nav-label">WORKSPACES</div>
        <button class="nav-item" data-view="chat" data-assistant="main"><span class="nav-icon">◌</span><span class="nav-text">Main assistant</span><kbd>⌘ 1</kbd></button>
        <button class="nav-item" data-view="research" data-assistant="research"><span class="nav-icon">⌕</span><span class="nav-text">Research</span></button>
        <button class="nav-item" data-view="learning" data-assistant="learning"><span class="nav-icon">↗</span><span class="nav-text">Learning & skills</span></button>
        <button class="nav-item" data-view="coding" data-assistant="coding"><span class="nav-icon">⌘</span><span class="nav-text">Coding & IDE</span></button>
        <button class="nav-item" data-view="projects" data-assistant="projects"><span class="nav-icon">▦</span><span class="nav-text">Projects</span></button>
        <button class="nav-item" data-view="lab" data-assistant="rd"><span class="nav-icon">⚗</span><span class="nav-text">R&D lab</span></button>
      </nav>
      <div class="history-heading"><div class="nav-label history-label">CONVERSATIONS</div><button class="history-clear" data-action="clear-history" title="Clear conversation history" aria-label="Clear conversation history">Clear</button></div>
      <div class="conversation-history-controls"><input id="conversationHistorySearch" type="search" placeholder="Search chat history…" aria-label="Search conversation history" autocomplete="off"><button type="button" class="history-filter" data-action="toggle-archived-conversations" aria-pressed="false">Archived</button></div>
      <div class="history-list" id="historyList">
        <div class="history-item" style="opacity:.6">Loading recent conversations…</div>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="knowledge"><span class="nav-icon">▤</span><span class="nav-text">Knowledge</span></button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">☷</span><span class="nav-text">Tasks & goals</span></button>
        <button class="nav-item" data-view="progress"><span class="nav-icon">◷</span><span class="nav-text">Progress</span></button>
        <button class="nav-item" data-view="appearance"><span class="nav-icon">◒</span><span class="nav-text">Themes & appearance</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-text">Settings</span></button>
        <div class="profile-row"><div class="avatar">P</div><div class="profile-copy"><strong>Personal account</strong><small>Private workspace</small></div><button class="icon-button" id="profileMenu" aria-label="Account menu">···</button></div>
      </div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span id="breadcrumbWorkspace">Main assistant</span><span class="crumb-sep">/</span><span id="breadcrumbPage">Conversation</span></div>
        <label class="global-search" for="globalSearchInput"><span aria-hidden="true">⌕</span><input id="globalSearchInput" type="search" placeholder="Search anything…" autocomplete="off" aria-label="Search workspace"><kbd>Ctrl K</kbd></label><div class="topbar-actions"><span class="preview-pill" id="connectionPill"><span></span> Private · checking</span><button class="icon-button" id="themeToggle" title="Toggle light/dark theme" aria-label="Toggle theme">◐</button><button class="icon-button" id="openThemeStudio" title="Customize appearance" aria-label="Customize appearance">◒</button></div>
      </header>
      <section id="viewRoot" class="view-root" aria-live="polite"></section>
    </main>
  </div>
  <dialog class="app-dialog" id="appDialog" aria-labelledby="appDialogTitle"><form id="appDialogForm" method="dialog"><div class="app-dialog-head"><div><div class="eyebrow" id="appDialogEyebrow">SPARKLE WORKSPACE</div><h2 id="appDialogTitle">Edit item</h2><p id="appDialogDescription"></p></div><button class="icon-button" type="button" data-dialog-cancel aria-label="Close dialog">×</button></div><div class="app-dialog-fields" id="appDialogFields"></div><div class="app-dialog-actions"><button class="soft-button" type="button" data-dialog-cancel>Cancel</button><button class="primary-button" type="submit" id="appDialogSubmit">Save</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="mobile-scrim" id="mobileScrim"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
